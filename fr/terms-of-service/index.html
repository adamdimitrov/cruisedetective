     GLOBAL JAVASCRIPT (CRO BADGES & STICKY CTA)
     ========================================== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const cruiseBlocks = document.querySelectorAll('.table-row-grey-3, .table-row-grey-3-copy, .table-row-grey-4, .table-row-white-4');
    if (cruiseBlocks.length === 0) return;

    // ==========================================
    // 1. CRO BADGES & URGENCY LOGIC
    // ==========================================
    cruiseBlocks.forEach((card, index) => {
        const titleWrapper = card.querySelector('.coin-name-wrapper');
        const button = card.querySelector('.buy-button-2, .buy-button-3');
        
        if (titleWrapper) {
            const isBudapest = window.location.hostname.includes('budapest');
            const isPersonallyTested = isBudapest ? true : (index < 5);

            if (isPersonallyTested && !titleWrapper.querySelector('.personally-tested-pill')) {
                titleWrapper.insertAdjacentHTML('afterbegin', '<div class="personally-tested-pill">✔️ Personally Tested</div>');
            }
        }
    });

    // ==========================================
    // 2. STICKY CTA LOGIC
    // ==========================================
    const cta = document.createElement('div');
    cta.className = 'global-sticky-cta'; 
    const text = document.createElement('div');
    text.className = 'global-sticky-cta-text';
    const btn = document.createElement('a');
    btn.className = 'global-sticky-cta-btn';
    btn.innerText = 'Check Availability';
    btn.target = '_blank';
    
    cta.appendChild(text);
    cta.appendChild(btn);
    document.body.appendChild(cta);

    const allBuyLinks = document.querySelectorAll('.buy-button-2, .buy-button-3');
    const cruiseData = [];
    
    cruiseBlocks.forEach((block, index) => {
        const buyLink = allBuyLinks[index] ? allBuyLinks[index] : allBuyLinks[0];
        if (!buyLink) return;

        const titleElem = block.querySelector('.coin-name, .coin-name-2');
        let title = 'Check Availability';
        if (titleElem) {
            title = 'Viewing: ' + titleElem.innerText.replace(/^[0-9]+\.\s*/, '').split(':')[0];
        }

        let reviewBlock = null;
        const parent = buyLink.parentElement;
        if (parent) {
            const readReviewLink = parent.querySelector('a[href^="#"]'); 
            if (readReviewLink) {
                const anchorId = readReviewLink.getAttribute('href'); 
                if (anchorId && anchorId.length > 1 && anchorId.startsWith('#')) {
                    const rawId = anchorId.substring(1);
                    reviewBlock = document.getElementById(rawId);
                }
            }
        }

        cruiseData.push({
            listBlock: block,
            reviewBlock: reviewBlock,
            link: buyLink.href,
            title: title
        });
    });

    if (cruiseData.length === 0) return;

    let ticking = false;

    function updateStickyCTA() {
        const viewportCenter = window.innerHeight / 2;
        let currentData = null;

        for (let i = 0; i < cruiseData.length; i++) {
            const rect = cruiseData[i].listBlock.getBoundingClientRect();
            if (rect.top <= viewportCenter && rect.bottom >= 0) {
                currentData = cruiseData[i];
                break;
            }
        }

        if (!currentData) {
            let lastPassedIndex = -1;
            for (let i = 0; i < cruiseData.length; i++) {
                if (cruiseData[i].reviewBlock) {
                    const revRect = cruiseData[i].reviewBlock.getBoundingClientRect();
                    if (revRect.top <= viewportCenter) {
                        lastPassedIndex = i;
                    }
                }
            }
            if (lastPassedIndex !== -1) {
                currentData = cruiseData[lastPassedIndex];
            }
        }

        const firstListRect = cruiseData[0].listBlock.getBoundingClientRect();
        if (firstListRect.top > viewportCenter) {
            currentData = null;
        }

        if (currentData) {
            btn.href = currentData.link;
            text.innerText = currentData.title;
            cta.classList.add('visible');
        } else {
            cta.classList.remove('visible');
        }
        ticking = false;
    }

    updateStickyCTA();
    window.addEventListener('scroll', function() {
        if (!ticking) {
            window.requestAnimationFrame(updateStickyCTA);
            ticking = true;
        }
    });
});
</script>

<!-- CruiseDetective Outbound Tiqets Pixel & Click ID Decorator -->
<script>
(function() {
  function getCookie(name) {
    var match = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  function getQueryParam(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function decorateTiqetsLinks() {
    var fbp = getCookie('_fbp');
    var fbclid = getQueryParam('fbclid') || sessionStorage.getItem('cd_fbclid');
    var gclid = getQueryParam('gclid') || sessionStorage.getItem('cd_gclid');

    if (getQueryParam('fbclid')) sessionStorage.setItem('cd_fbclid', getQueryParam('fbclid'));
    if (getQueryParam('gclid')) sessionStorage.setItem('cd_gclid', getQueryParam('gclid'));

    var links = document.querySelectorAll('a[href*="tiqets.com"]');
    links.forEach(function(link) {
      try {
        var url = new URL(link.href);
        var currentCampaign = url.searchParams.get('tq_campaign') || '';

        if (fbp && !currentCampaign.includes('fbp-')) {
          currentCampaign = (currentCampaign ? currentCampaign + '--' : '') + 'fbp-' + fbp;
        }
        if (fbclid && !currentCampaign.includes('fbclid-')) {
          currentCampaign = (currentCampaign ? currentCampaign + '--' : '') + 'fbclid-' + fbclid;
          url.searchParams.set('fbclid', fbclid);
          url.searchParams.set('subid', 'fbclid:' + fbclid);
        }
        if (gclid && !currentCampaign.includes('gclid-')) {
          currentCampaign = (currentCampaign ? currentCampaign + '--' : '') + 'gclid-' + gclid;
          url.searchParams.set('gclid', gclid);
        }

        if (currentCampaign) {
          url.searchParams.set('tq_campaign', currentCampaign);
        }
        link.href = url.toString();
      } catch (e) {}
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', decorateTiqetsLinks);
  } else {
    decorateTiqetsLinks();
  }

  document.addEventListener('click', function(e) {
    var target = e.target.closest('a[href*="tiqets.com"]');
    if (target) {
      decorateTiqetsLinks();
    }
  }, true);
})();
</script></body></html>
