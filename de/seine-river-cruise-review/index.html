     GLOBAL JAVASCRIPT (CRO BADGES & STICKY CTA)
     ========================================== -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const cruiseBlocks = document.querySelectorAll('.table-row-grey-3, .table-row-grey-3-copy, .table-row-grey-4, .table-row-white-4');
    if (cruiseBlocks.length === 0) return;

    // ==========================================
    // 1. CRO BADGES & URGENCY LOGIC
    // ==========================================
    cruiseBlocks.forEach((card, index) => {
        const titleWrapper = card.querySelector('.coin-name-wrapper');
        const button = card.querySelector('.buy-button-2, .buy-button-3');
        
        if (titleWrapper) {
            const isBudapest = window.location.hostname.includes('budapest');
            const isPersonallyTested = isBudapest ? true : (index < 5);

            if (isPersonallyTested && !titleWrapper.querySelector('.personally-tested-pill')) {
                titleWrapper.insertAdjacentHTML('afterbegin', '<div class="personally-tested-pill">✔️ Personally Tested</div>');
            }
        }
    });

    // ==========================================
    // 2. STICKY CTA LOGIC
    // ==========================================
    const cta = document.createElement('div');
    cta.className = 'global-sticky-cta'; 
    const text = document.createElement('div');
    text.className = 'global-sticky-cta-text';
    const btn = document.createElement('a');
    btn.className = 'global-sticky-cta-btn';
    btn.innerText = 'Check Availability';
    btn.target = '_blank';
    
    cta.appendChild(text);
    cta.appendChild(btn);
    document.body.appendChild(cta);

    const allBuyLinks = document.querySelectorAll('.buy-button-2, .buy-button-3');
    const cruiseData = [];
    
    cruiseBlocks.forEach((block, index) => {
        const buyLink = allBuyLinks[index] ? allBuyLinks[index] : allBuyLinks[0];
        if (!buyLink) return;

        const titleElem = block.querySelector('.coin-name, .coin-name-2');
        let title = 'Check Availability';
        if (titleElem) {
            title = 'Viewing: ' + titleElem.innerText.replace(/^[0-9]+\.\s*/, '').split(':')[0];
        }

        let reviewBlock = null;
        const parent = buyLink.parentElement;
        if (parent) {
            const readReviewLink = parent.querySelector('a[href^="#"]'); 
            if (readReviewLink) {
                const anchorId = readReviewLink.getAttribute('href'); 
                if (anchorId && anchorId.length > 1 && anchorId.startsWith('#')) {
                    const rawId = anchorId.substring(1);
                    reviewBlock = document.getElementById(rawId);
                }
            }
        }

        cruiseData.push({
            listBlock: block,
            reviewBlock: reviewBlock,
            link: buyLink.href,
            title: title
        });
    });

    if (cruiseData.length === 0) return;

    let ticking = false;

    function updateStickyCTA() {
        const viewportCenter = window.innerHeight / 2;
        let currentData = null;

        for (let i = 0; i < cruiseData.length; i++) {
            const rect = cruiseData[i].listBlock.getBoundingClientRect();
            if (rect.top <= viewportCenter && rect.bottom >= 0) {
                currentData = cruiseData[i];
                break;
            }
        }

        if (!currentData) {
            let lastPassedIndex = -1;
            for (let i = 0; i < cruiseData.length; i++) {
                if (cruiseData[i].reviewBlock) {
                    const revRect = cruiseData[i].reviewBlock.getBoundingClientRect();
                    if (revRect.top <= viewportCenter) {
                        lastPassedIndex = i;
                    }
                }
            }
            if (lastPassedIndex !== -1) {
                currentData = cruiseData[lastPassedIndex];
            }
        }

        const firstListRect = cruiseData[0].listBlock.getBoundingClientRect();
        if (firstListRect.top > viewportCenter) {
            currentData = null;
        }

        if (currentData) {
            btn.href = currentData.link;
            text.innerText = currentData.title;
            cta.classList.add('visible');
        } else {
            cta.classList.remove('visible');
        }
        ticking = false;
    }

    updateStickyCTA();
    window.addEventListener('scroll', function() {
        if (!ticking) {
            window.requestAnimationFrame(updateStickyCTA);
            ticking = true;
        }
    });
});
</script>

<!-- CruiseDetective Outbound Tiqets Pixel & Click ID Decorator -->
<script>
(function() {
  function getCookie(name) {
    var match = document.cookie.match(new RegExp('(?:^|;\\s*)' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  function getQueryParam(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function decorateTiqetsLinks() {
    var fbp = getCookie('_fbp');
    var fbclid = getQueryParam('fbclid') || sessionStorage.getItem('cd_fbclid');
    var gclid = getQueryParam('gclid') || sessionStorage.getItem('cd_gclid');

    if (getQueryParam('fbclid')) sessionStorage.setItem('cd_fbclid', getQueryParam('fbclid'));
    if (getQueryParam('gclid')) sessionStorage.setItem('cd_gclid', getQueryParam('gclid'));

    var links = document.querySelectorAll('a[href*="tiqets.com"]');
    links.forEach(function(link) {
      try {
        var url = new URL(link.href);
        var currentCampaign = url.searchParams.get('tq_campaign') || '';

        if (fbp && !currentCampaign.includes('fbp-')) {
          currentCampaign = (currentCampaign ? currentCampaign + '--' : '') + 'fbp-' + fbp;
        }
        if (fbclid && !currentCampaign.includes('fbclid-')) {
          currentCampaign = (currentCampaign ? currentCampaign + '--' : '') + 'fbclid-' + fbclid;
          url.searchParams.set('fbclid', fbclid);
          url.searchParams.set('subid', 'fbclid:' + fbclid);
        }
        if (gclid && !currentCampaign.includes('gclid-')) {
          currentCampaign = (currentCampaign ? currentCampaign + '--' : '') + 'gclid-' + gclid;
          url.searchParams.set('gclid', gclid);
        }

        if (currentCampaign) {
          url.searchParams.set('tq_campaign', currentCampaign);
        }
        link.href = url.toString();
      } catch (e) {}
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', decorateTiqetsLinks);
  } else {
    decorateTiqetsLinks();
  }

  document.addEventListener('click', function(e) {
    var target = e.target.closest('a[href*="tiqets.com"]');
    if (target) {
      decorateTiqetsLinks();
    }
  }, true);
})();
</script>

border-radius: 8px;\n    border: 1px solid #e2e8f0;\n}\n\n.feature-list .emoji {\n    font-size: 1.5rem;\n    margin-right: 1rem;\n    flex-shrink: 0;\n}\n\n/* Expanded Features */\n.expanded-features h3 {\n    font-size: 1.25rem;\n    color: var(--accent);\n    margin-top: 1.5rem;\n    margin-bottom: 0.5rem;\n    display: flex;\n    align-items: center;\n}\n\n.expanded-features ul {\n    margin-left: 1.5rem;\n    margin-bottom: 1.5rem;\n}\n\n.expanded-features li {\n    margin-bottom: 0.5rem;\n}\n\n.content-img {\n    width: 100%;\n    height: auto;\n    border-radius: 8px;\n    margin: 1rem 0;\n    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);\n    display: block;\n}\n\n.video-container {\n    position: relative;\n    padding-bottom: 56.25%; /* 16:9 aspect ratio */\n    height: 0;\n    overflow: hidden;\n    margin: 1.5rem 0;\n    border-radius: 8px;\n    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);\n}\n\n.video-container iframe {\n    position: absolute;\n    top: 0;\n    left: 0;\n    width: 100%;\n    height: 100%;\n}\n\n/* Reviews */\n.reviews-section {\n    background: #fffbeb;\n    border: 1px solid #fde68a;\n    padding: 2rem;\n    border-radius: 12px;\n    margin: 2rem 0;\n    text-align: center;\n}\n\n.rating-summary {\n    margin-bottom: 1rem;\n}\n\n.stars {\n    color: var(--warning);\n    font-size: 1.5rem;\n    letter-spacing: 2px;\n}\n\n.score {\n    font-weight: 700;\n    font-size: 1.25rem;\n    margin: 0 0.5rem;\n}\n\n.review-count {\n    display: block;\n    font-size: 0.85rem;\n    color: var(--text-muted);\n}\n\n.review-card {\n    font-style: italic;\n    font-size: 1.1rem;\n}\n\n.reviewer {\n    font-style: normal;\n    font-weight: 600;\n    margin-top: 1rem;\n    font-size: 0.9rem;\n}\n\n/* CTA Buttons */\n.cta-button {\n    display: block;\n    width: 100%;\n    text-align: center;\n    background-color: var(--cta-color);\n    color: #ffffff;\n    font-family: var(--font-heading);\n    font-weight: 700;\n    font-size: 1.125rem;\n    padding: 1rem 1.5rem;\n    border-radius: 8px;\n    text-decoration: none;\n    margin: 2rem 0;\n    transition: background-color 0.2s, transform 0.2s;\n    box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.4);\n}\n\n.cta-button:hover {\n    background-color: var(--cta-hover);\n    transform: translateY(-2px);\n}\n\n.cta-arrow {\n    margin-left: 0.5rem;\n}\n\n.pulse-effect {\n    animation: pulse 2s infinite;\n}\n\n@keyframes pulse {\n    0% {\n        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);\n    }\n    70% {\n        box-shadow: 0 0 0 15px rgba(16, 185, 129, 0);\n    }\n    100% {\n        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);\n    }\n}\n\n.final-cta-box {\n    background-color: var(--primary-color);\n    color: white;\n    padding: 2.5rem 2rem;\n    border-radius: 12px;\n    text-align: center;\n    margin: 3rem 0;\n}\n\n.final-cta-box h3 {\n    color: white;\n    border: none;\n    margin-top: 0;\n}\n\n.final-cta-box p {\n    color: #cbd5e1;\n}\n\n.large-cta {\n    font-size: 1.25rem;\n    padding: 1.25rem 2rem;\n}\n\n.secure-checkout {\n    font-size: 0.8rem !important;\n    margin-bottom: 0 !important;\n    opacity: 0.8;\n}\n\n/* Sticky Floating CTA */\n.sticky-cta {\n    position: fixed;\n    bottom: 1.5rem;\n    right: 1.5rem;\n    z-index: 100;\n    display: none; /* Shown via JS on scroll */\n}\n\n.sticky-cta .cta-button {\n    margin: 0;\n    padding: 0.75rem 1.5rem;\n    border-radius: 9999px;\n    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2), 0 4px 6px -2px rgba(0,0,0,0.1);\n    font-size: 1rem;\n    white-space: nowrap;\n}\n\n/* Footer */\n.main-footer {\n    background: var(--bg-light);\n    padding: 3rem 1.5rem;\n    text-align: center;\n    border-top: 1px solid #e2e8f0;\n    font-size: 0.85rem;\n    color: var(--text-muted);\n}\n\n.main-footer .disclaimer {\n    margin-top: 1rem;\n    font-size: 0.75rem;\n    opacity: 0.8;\n}\n\n/* Responsive */\n\n\n@media (max-width: 768px) {\n    h1 {\n        font-size: 1.75rem;\n    }\n    h2 {\n        font-size: 1.5rem;\n    }\n    .content-wrapper {\n        margin-top: 1rem;\n    }\n    .feature-list li {\n        flex-direction: column;\n    }\n    .feature-list .emoji {\n        margin-bottom: 0.5rem;\n    }\n    /* Adding padding to bottom so sticky CTA doesn't cover content */\n    body {\n        padding-bottom: 80px; \n    }\n}\n\n";

    const content = document.createElement("div");
    content.innerHTML = "\n\n    <header class=\"main-header\">\n        <div class=\"adv-container header-container\">\n            <div class=\"logo-link\" style=\"cursor: default;\">\n                <img src=\"/assets/cdn/6369a6904656314914c2bae2/6369a8d295be04a841e17ea5_logo.svg\" alt=\"The Cruise Detective Logo\" class=\"logo\">\n                <span class=\"logo-text\">THE CRUISE DETECTIVE</span>\n            </div>\n        </div>\n    </header>\n\n    <main class=\"content-wrapper\">\n        <article class=\"review-article\">\n            \n            <h1 class=\"headline\">I Spent 12 Days Testing Every Seine River Cruise in Paris \u2013 Here\u2019s The Only One Worth Your Money.</h1>\n            \n            <div class=\"author-meta\">\n                <img src=\"/assets/cdn/652d0405192ba076b04f74a3/652d0405192ba076b04f792e_Adam-dimitrov-portrait-75x75.webp\" alt=\"Adam Dimitrov\" class=\"author-img\">\n                <div class=\"meta-info\">\n                    <p class=\"author-name\">By <a href=\"https://www.thecruisedetective.com/about\" target=\"_blank\" style=\"color: inherit;\"><strong>Adam Dimitrov</strong></a>, Head Cruise Detective</p>\n                    <p class=\"publish-date\">Updated on <span id=\"dynamic-date\">February 17, 2025</span></p>\n                </div>\n            </div>\n\n            <div class=\"hero-image-container\">\n                <img src=\"/assets/cdn/652d0405192ba076b04f74a3/656b5108d54edc5c99f86b14_best-river-cruises-paris-featured-image.webp\" alt=\"Seine River Cruise passing the Eiffel Tower\" class=\"hero-image\">\n                <p class=\"image-caption\">If you're visiting Paris, a Seine River Cruise is an absolute must. But which one do you choose?</p>\n            </div>\n\n            <div class=\"article-body\">\n                <div class=\"highlight-box\" style=\"margin-top: 0; background-color: #f0fdf4; border-left-color: #10b981;\">\n                    <p style=\"color: #064e3b; margin-bottom: 1rem;\"><strong>\u23f1\ufe0f TL;DR Summary:</strong> After testing 10 different Seine river cruises over 12 days, <strong>Bateaux Parisiens</strong> is the undisputed #1 choice for its 360\u00b0 views, excellent audio app, and location right beneath the Eiffel Tower.</p>\n                    <a href=\"https://www.tiqets.com/en/things-to-do-in-paris-c66746/tickets-for-sightseeing-cruise-on-the-seine-p973977/?partner=thecruisedetective.com-176436&tq_campaign=adv-tldr\" class=\"cta-button pulse-effect\" target=\"_blank\" rel=\"nofollow\" style=\"margin: 0; padding: 0.75rem 1rem; font-size: 1rem;\">\n                        CHECK AVAILABILITY & SKIP THE TICKET LINE <span class=\"cta-arrow\">\u2192</span>\n                    </a>\n                </div>\n\n                <p><strong>PARIS, FRANCE</strong> \u2014 Imagine this: You\u2019ve finally made it to Paris. You\u2019re standing by the banks of the Seine, the Eiffel Tower is twinkling in the distance, and you\u2019re ready for that iconic river cruise you\u2019ve been dreaming about.</p>\n\n                <p>But when you look at the options, your heart sinks. There are dozens of boats. The ticket lines are massive. Every tour company is claiming to be the \"best.\" How do you know you're not walking straight into an overpriced tourist trap with dirty windows and terrible audio guides?</p>\n\n                <div class=\"highlight-box\">\n                    <p>That\u2019s exactly the problem I ran into. So, I decided to do something crazy: <strong>I embarked on a 12-day journey to Paris to test every single major Seine River Cruise myself.</strong></p>\n                </div>\n\n                <h2>The 12-Day Experiment</h2>\n                \n                <p>I actually tested 10 different boats in total (including 5 dinner cruises). You can even see <a href=\"https://www.thecruisedetective.com/seine-river-cruises-paris-1\" target=\"_blank\">my full listicle ranking all of them here</a> if you want to see the raw data. I sat on the upper decks, I sat on the lower decks. I listened to the audio guides. I checked the legroom, the cleanliness of the bathrooms, and most importantly\u2014the views.</p>\n                \n                <p>While some of the famous names turned out to be cramped and disappointing, one specific cruise absolutely blew the others out of the water. </p>\n\n                <p>If you only have time for one river cruise in Paris, <strong>Bateaux Parisiens</strong> is the undisputed champion. Here\u2019s why.</p>\n\n                <a href=\"https://www.tiqets.com/en/things-to-do-in-paris-c66746/tickets-for-sightseeing-cruise-on-the-seine-p973977/?partner=thecruisedetective.com-176436&tq_campaign=adv-middle\" class=\"cta-button pulse-effect\" target=\"_blank\" rel=\"nofollow\">\n                    CHECK AVAILABILITY & SKIP THE TICKET LINE \n                    <span class=\"cta-arrow\">\u2192</span>\n                </a>\n\n                <h2>Why Bateaux Parisiens Took the #1 Spot</h2>\n\n                <img src=\"/assets/cdn/652d0405192ba076b04f74a3/699480970fd56c513a2749e0_bateaux-parisiens-sighteeing-cruise-00002.avif\" alt=\"Bateaux Parisiens Boat\" class=\"content-image\">\n\n                <p>Out of all the boats I tested, Bateaux Parisiens offered the most premium experience for the price. Here is what makes them stand out from the crowd:</p>\n\n                <div class=\"expanded-features\">\n                    <img src=\"/assets/cdn/652d0405192ba076b04f74a3/653a40c21889f4f91e8b7f7f_1-bateaux-parisiens-sighteeing-cruise%20(10).webp\" alt=\"Passengers enjoying the views on Bateaux Parisiens\" class=\"content-img\" loading=\"lazy\">\n                    <p>I wasn\u2019t disappointed. Bateaux Parisiens and its boats are absolutely top-notch. They have spacious decks, 360\u00b0 panoramic views up top, cozy seats, vending machines and clean restrooms. After testing everything out, here is my detailed breakdown of the experience.</p>\n                    \n                    <h3>1. The Ship & The Views</h3>\n                    <img src=\"/assets/cdn/652d0405192ba076b04f74a3/6583443c6e576281beda7395_bateaux-parisiens-sighteeing-cruise%20(4).webp\" alt=\"The modern double-decker Bateaux Parisiens ship\" class=\"content-img\" loading=\"lazy\">\n                    <p>Unlike many older boats that feel like cramped floating buses, Bateaux Parisiens operates a fleet of 8 modern, spacious double-decker ships that hold up to 400 passengers. If you head to the upper deck, you're treated to <strong>unobstructed 360\u00b0 panoramic views</strong>.</p>\n                    <img src=\"/assets/cdn/652d0405192ba076b04f74a3/658343456e576281bed9f072_bateaux-parisiens-sighteeing-cruise%20(11).webp\" alt=\"The top deck of the cruise\" class=\"content-img\" loading=\"lazy\">\n                    <p>There are no thick window frames or low ceilings to ruin your photos of the Louvre or Notre Dame. (Pro tip: grab a spot at the standing-only frontal section for the absolute best vantage point!)</p>\n\n                    <h3>2. Three Different Audio Guide Options</h3>\n                    <p>On other cruises, you're usually stuck with a single, muffled loudspeaker that you can barely hear over the engine noise. Bateaux Parisiens gives you three distinct options:</p>\n                    <img src=\"/assets/cdn/652d0405192ba076b04f74a3/653a4486ad58854c723f3a49_1-bateaux-parisiens-sighteeing-cruise%20(38).webp\" alt=\"Smartphone audio guide\" class=\"content-img\" loading=\"lazy\">\n                    <ul>\n                        <li><strong>Smartphone App (The Best Option):</strong> A crystal-clear, web-based app in 11 languages that you play directly from your own phone. It even includes interactive photo filters and quizzes. No download required!</li>\n                        <li><strong>Built-In Audio Dials:</strong> If your phone is dead, every lower-deck window seat has a wired \"phone dial\" style audio guide with 14 languages.</li>\n                        <li><strong>Live Guide:</strong> A real person narrating the journey through the loudspeakers in 4 languages.</li>\n                    </ul>\n\n                    <h3>3. Departs Right Beneath The Eiffel Tower</h3>\n                    <img src=\"/assets/cdn/652d0405192ba076b04f74a3/653a3f5d72ec5dfeaf74d0cc_1-bateaux-parisiens-sighteeing-cruise%20(1).webp\" alt=\"Assembly area at the Eiffel Tower\" class=\"content-img\" loading=\"lazy\">\n                    <p>The meeting point is right at Port de la Bourdonnais, literally <strong>just a two-minute walk from the Eiffel Tower</strong>. The assembly area is incredibly organized with a covered waiting zone, food vendors, and a fast security check.</p>\n                    <img src=\"/assets/cdn/652d0405192ba076b04f74a3/653a3feafe9dfc29b0e39b63_1-bateaux-parisiens-sighteeing-cruise%20(5).webp\" alt=\"Boarding area with vending machines\" class=\"content-img\" loading=\"lazy\">\n                    <p>Plus, the schedule is beautifully flexible: boats depart every 30-60 minutes from 10 AM to 10 PM. You simply book for a specific day, show up whenever you're ready, and hop on the next departure.</p>\n\n                    <h3>4. Complete Comfort (Aircon, Vending Machines & Accessibility)</h3>\n                    <img src=\"/assets/cdn/652d0405192ba076b04f74a3/653a4565140dc2a88f7a3000_1-bateaux-parisiens-sighteeing-cruise%20(7).webp\" alt=\"Onboard vending machines and amenities\" class=\"content-img\" loading=\"lazy\">\n                    <p>Whether you're visiting during the scorching Paris summer or the freezing winter, the lower deck is fully climate-controlled. There are clean restrooms on board, vending machines for snacks and drinks, and the main deck is fully accessible for both wheelchairs and baby strollers (they even offer free entry for infants under 3!).</p>\n                    \n                    <div class=\"video-container\">\n                        <iframe src=\"https://tube.rvere.com/embed?v=nG4YVVCfo6k\" title=\"Bateaux Parisiens Review\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\" allowfullscreen></iframe>\n                    </div>\n\n                    <h3>5. Risk-Free Booking</h3>\n                    <p>Nervous about your travel plans changing? Tiqets offers a generous cancellation policy allowing a <strong>full refund if canceled 24 hours in advance</strong>, plus a \"reserve now, pay later\" option. It's completely risk-free.</p>\n                </div>\n\n                <h2>What Real Travelers Are Saying</h2>\n\n                <div class=\"reviews-section\">\n                    <div class=\"rating-summary\">\n                        <span class=\"stars\">\u2605\u2605\u2605\u2605\u2605</span>\n                        <span class=\"score\">4.4/5</span>\n                        <span class=\"review-count\">Based on over 77,000+ Reviews</span>\n                    </div>\n                    <div class=\"review-card\">\n                        <p class=\"review-text\">\"Absolutely breathtaking. The audio guide was fascinating and the boat was pristine. Seeing the Eiffel Tower sparkle from the water is a memory I'll never forget. Highly recommend booking in advance!\"</p>\n                        <p class=\"reviewer\">- Sarah T. (Verified Buyer)</p>\n                    </div>\n                </div>\n\n                <h2>Don't Make This Rookie Mistake</h2>\n\n                <p>The worst thing you can do is show up at the dock without a ticket. The queues can be over an hour long, especially during sunset and evening cruises. During the spring and summer, the highly coveted sunset cruises regularly sell out days in advance online. If you just walk up to the dock, you will likely be turned away or stuck waiting 2 hours for a daytime slot.</p>\n\n                <p>To guarantee your spot on the best boat in Paris, <strong>you must book your tickets online in advance.</strong> It costs the exact same (sometimes less with family discounts) and saves you hours of waiting.</p>\n\n                <div class=\"final-cta-box\">\n                    <h3>Ready to see Paris from the Seine?</h3>\n                    <p>Click the button below to secure your tickets for Bateaux Parisiens before they sell out for your travel dates.</p>\n                    <a href=\"https://www.tiqets.com/en/things-to-do-in-paris-c66746/tickets-for-sightseeing-cruise-on-the-seine-p973977/?partner=thecruisedetective.com-176436&tq_campaign=adv-bottom\" class=\"cta-button large-cta pulse-effect\" target=\"_blank\" rel=\"nofollow\">\n                        SECURE YOUR TICKETS & SKIP THE LINE \n                        <span class=\"cta-arrow\">\u2192</span>\n                    </a>\n                    <p class=\"secure-checkout\">\ud83d\udd12 Secure Checkout via Tiqets</p>\n                </div>\n            </div>\n        </article>\n    </main>\n\n    <footer class=\"main-footer\">\n        <div class=\"adv-container\">\n            <div class=\"footer-links\" style=\"margin-bottom: 1rem; display: flex; justify-content: center; gap: 1rem;\">\n                <a href=\"/privacy-policy\" style=\"color: inherit; text-decoration: underline;\">Privacy Policy</a>\n                <a href=\"/terms-of-service\" style=\"color: inherit; text-decoration: underline;\">Terms of Service</a>\n                <a href=\"/contact\" style=\"color: inherit; text-decoration: underline;\">Contact Us</a>\n            </div>\n            <p>Copyright \u00a9 <span id=\"current-year\"></span> The Cruise Detective. All Rights Reserved.</p>\n            <p class=\"disclaimer\">This is an advertorial based on personal experience. We may earn a commission if you book through our links, at no extra cost to you.</p>\n            <p class=\"disclaimer\" style=\"margin-top: 1rem; font-size: 0.7rem;\">This site is not a part of the Facebook website or Facebook Inc. Additionally, This site is NOT endorsed by Facebook in any way. FACEBOOK is a trademark of FACEBOOK, Inc.</p>\n        </div>\n    </footer>\n\n    <!-- Sticky Floating CTA -->\n    <div class=\"sticky-cta\" id=\"sticky-cta\">\n        <a href=\"https://www.tiqets.com/en/things-to-do-in-paris-c66746/tickets-for-sightseeing-cruise-on-the-seine-p973977/?partner=thecruisedetective.com-176436&tq_campaign=adv-sticky\" class=\"cta-button\" target=\"_blank\" rel=\"nofollow\">\n            CHECK AVAILABILITY & SKIP THE LINE\n        </a>\n    </div>\n\n    \n";

            });
